# Flashlight: Dovecot's lookups in the PostfixAdmin database. DON'T EDIT: rewritten at every boot from the
# Flashlight release (the password comes from /mnt/mailserver/root/secrets).
driver = mysql
default_pass_scheme = CRYPT
connect = host=127.0.0.1 dbname=postfix user=postfix password={database_password}
# A mailbox works only while both it and its domain are active (the Active flags in PostfixAdmin): a turned-off
# domain turns off logins and sending of all its mailboxes, not only its incoming mail (Postfix's lookups)
user_query = SELECT '/mnt/mailserver/mail/%d/%u' as home, 'maildir:/mnt/mailserver/mail/%d/%u' as mail, 5000 AS uid, 5000 AS gid, concat('*:bytes=', mailbox.quota) AS quota_rule FROM mailbox JOIN domain ON domain.domain = mailbox.domain WHERE mailbox.username = '%u' AND mailbox.active = '1' AND domain.active = '1'
password_query = SELECT mailbox.username as user, mailbox.password, '/mnt/mailserver/mail/%d/%u' as userdb_home, 'maildir:/mnt/mailserver/mail/%d/%u' as userdb_mail, 5000 as userdb_uid, 5000 as userdb_gid, concat('*:bytes=', mailbox.quota) AS userdb_quota_rule FROM mailbox JOIN domain ON domain.domain = mailbox.domain WHERE mailbox.username = '%u' AND mailbox.active = '1' AND domain.active = '1'
# lets doveadm run commands for all mailboxes (-A), e.g. quota recalc
iterate_query = SELECT mailbox.username AS user FROM mailbox JOIN domain ON domain.domain = mailbox.domain WHERE mailbox.active = '1' AND domain.active = '1'
