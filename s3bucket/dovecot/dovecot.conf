listen = *

mail_plugins = mailbox_alias acl quota
protocols = imap sieve lmtp

mail_uid = 5000
mail_gid = 5000

first_valid_uid = 5000
last_valid_uid = 5000

auth_verbose = yes
# Logs go to syslog: /var/log/maillog (together with Postfix) and the systemd journal (journalctl -u dovecot)

ssl_min_protocol = TLSv1.2
ssl = required
#verbose_ssl = yes
ssl_cert = </etc/letsencrypt/live/{MailDomain}/fullchain.pem
ssl_key = </etc/letsencrypt/live/{MailDomain}/privkey.pem

# ciphers follow the AlmaLinux system crypto policy (Dovecot's default ssl_cipher_list = PROFILE=SYSTEM)

disable_plaintext_auth = no

mail_location = maildir:/mnt/mailserver/mail/%d/%u/
# Mail is on EFS (NFS): read index files instead of memory-mapping them (Dovecot recommendation for NFS)
mmap_disable = yes

auth_default_realm = {MainDomain}

auth_mechanisms = PLAIN LOGIN

service auth {
  # Postfix checks logins on ports 587/465 through this socket
  unix_listener /var/spool/postfix/private/dovecot-auth {
    user = postfix
    group = postfix
    mode = 0660
  }
  unix_listener auth-userdb {
    user = vmail
    group = vmail
    mode = 0660
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    user = postfix
    group = postfix
    mode = 0600
  }

  inet_listener lmtp {
    address = 127.0.0.1
    port = 24
  }
}

userdb {
  args = /etc/dovecot/dovecot-mysql.conf
  driver = sql
}

passdb {
  args = /etc/dovecot/dovecot-mysql.conf
  driver = sql
}

auth_master_user_separator = *

plugin {
  acl = vfile
  acl_shared_dict = file:/mnt/mailserver/mail/shared-folders/shared-mailboxes.db
  # mailbox quotas set in PostfixAdmin (quota_rule comes from dovecot-mysql.conf); usage is counted from the indexes
  quota = count:User quota
  quota_vsizes = yes
  # user Sieve scripts (filters, vacation) managed from Roundcube through ManageSieve.
  # Kept outside the Maildir: home is the Maildir root, where every dot-entry is a mail folder
  # (~/.sieve and ~/.dovecot.sieve broke quota counting as bogus folders)
  sieve = file:/mnt/mailserver/mail/sieve/%d/%u;active=/mnt/mailserver/mail/sieve/%d/%u/active.sieve
  mailbox_alias_old = Sent
  mailbox_alias_new = Sent Messages
  mailbox_alias_old2 = Sent
  mailbox_alias_new2 = Sent Items
}

# Postfix delivers incoming mail here (virtual_transport = lmtp:unix:private/dovecot-lmtp)
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

protocol imap {
  mail_plugins = $mail_plugins imap_acl imap_quota
  imap_client_workarounds = tb-extra-mailbox-sep
  mail_max_userip_connections = 30
}

#protocol pop3 {
# mail_plugins = $mail_plugins
# pop3_client_workarounds = outlook-no-nuls oe-ns-eoh
# pop3_uidl_format = %08Xu%08Xv
# mail_max_userip_connections = 30
#}

# High-performance login mode: a fixed pool of 8 processes handles the login phase and the TLS of all
# IMAP connections (Dovecot keeps encrypting a session in imap-login after login). Memory stays flat
# however many connections bots open (one process per connection would cost ~9 MB each and could run
# a 2 GB server out of memory); a crash of one process drops only ~1/8 of the sessions.
service imap-login {
  service_count = 0
  process_min_avail = 8
}

#service pop3-login {
#  service_count = 1
#}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

namespace {
  type = private
  separator = /
  prefix =
  inbox = yes

  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox "Sent Messages" {
    auto = no
    special_use = \Sent
  }
  mailbox "Sent Items" {
    auto = no
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox "Deleted Messages" {
    auto = no
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Spam {
    auto = no
    special_use = \Junk
  }
  mailbox "Junk E-mail" {
    auto = no
    special_use = \Junk
  }
  mailbox Archive {
    auto = no
    special_use = \Archive
  }
  mailbox Archives {
    auto = no
    special_use = \Archive
  }
}

namespace {
  type = shared
  separator = /
  prefix = Shared/%%u/
  location = maildir:%%h:INDEX=%h/shared/%%u
  subscriptions = yes
  list = children
}
