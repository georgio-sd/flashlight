# Flashlight OpenDKIM configuration (OpenDKIM 2.11, AlmaLinux 10).
# DON'T EDIT THIS FILE: base.sh rewrites it at every boot from the Flashlight release, so upgrades can change it
# (OpenDKIM can't include a file of your own). It sits on EFS next to the keys (/etc/postfix/dkim/opendkim.conf);
# systemd starts OpenDKIM with it through /etc/sysconfig/opendkim.
# Keys and both tables are rebuilt by base.sh at every boot from the stack's domain list.

# sign mail from our domains (sent by logged-in users or by the server itself) and verify incoming mail
# (the verification result goes into an Authentication-Results header)
Mode sv
Syslog yes
SyslogSuccess yes
LogWhy yes
UserID opendkim:opendkim
# Postfix talks to OpenDKIM here (smtpd_milters in main.cf)
Socket inet:8891@localhost
Umask 022

Canonicalization relaxed/relaxed
MinimumKeyBits 1024
# a second From header can't be added to a signed message without breaking the signature
OversignHeaders From

# key name -> domain:selector:private key file
KeyTable file:/etc/postfix/dkim/keytable
# sender address pattern -> key name (*@domain needs pattern matching)
SigningTable refile:/etc/postfix/dkim/signingtable
