# Flashlight OpenDKIM configuration (OpenDKIM 2.11, AlmaLinux 10).
# DON'T EDIT THIS FILE: base.sh rewrites it at every boot from the Flashlight release, so upgrades can change it
# (OpenDKIM can't include a file of your own). It sits on EFS next to the keys
# (/mnt/mailserver/etc/postfix/dkim/opendkim.conf); systemd starts OpenDKIM with it through /etc/sysconfig/opendkim.
# Keys and both tables are rebuilt by base.sh at every boot from the stack's domain list.

# Sign mail from our domains (sent by logged-in users or by the server itself). base.sh sets the mode: "sv" also
# verifies incoming mail (the result goes into an Authentication-Results header); with the spam filter (stack
# parameter Antispam) it is "s", sign only: Rspamd checks SPF, DKIM, DMARC and ARC and writes the full
# Authentication-Results header, which OpenDKIM, as the later milter, would otherwise replace with its own
Mode {Mode}
Syslog yes
SyslogSuccess yes
LogWhy yes
UserID opendkim:opendkim
# Postfix talks to OpenDKIM here (smtpd_milters in main.cf)
Socket inet:8891@localhost
Umask 022

Canonicalization relaxed/relaxed
MinimumKeyBits 1024
# a second From header can't be added to a signed message without breaking the signature
OversignHeaders From

# key name -> domain:selector:private key file
KeyTable file:/mnt/mailserver/etc/postfix/dkim/keytable
# sender address pattern -> key name (*@domain needs pattern matching)
SigningTable refile:/mnt/mailserver/etc/postfix/dkim/signingtable
