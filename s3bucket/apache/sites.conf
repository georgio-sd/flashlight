# Flashlight sites (Apache 2.4, AlmaLinux 10).
# DON'T EDIT THIS FILE: base.sh rewrites it at every boot from the Flashlight release, so upgrades can change it.
# Your own settings go to these files on EFS, which upgrades never touch:
#   /mnt/mailserver/etc/httpd/custom.conf        global settings and your own sites (read after this file)
#   /mnt/mailserver/etc/httpd/custom-mail.conf   inside the webmail site below
#   /mnt/mailserver/etc/httpd/custom-admin.conf  inside the administration site below
# The rest of Apache's config is the package's own (httpd.conf, ssl.conf, conf.modules.d).
# Values in curly braces are filled in by base.sh.

ServerName {MailDomain}
ServerAdmin {AdminEmail}
# no Apache/OS version in headers and error pages
ServerTokens Prod
TraceEnable off
Protocols h2 http/1.1
Header always set X-Content-Type-Options "nosniff"

#
# Port 80: only our two names are redirected to HTTPS
#
# The first virtual host of a port is the default one: it answers requests by IP address and for
# unknown names (scanners), so it refuses everything
<VirtualHost *:80>
    ServerName localhost
    <Location />
        Require all denied
    </Location>
</VirtualHost>

<VirtualHost *:80>
    ServerName {MailDomain}
    Redirect permanent / https://{MailDomain}/
</VirtualHost>

<VirtualHost *:80>
    ServerName {AdminDomain}
    Redirect permanent / https://{AdminDomain}/
</VirtualHost>

#
# Port 443
#
<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    # self-signed for "localhost" (base.sh): this site only refuses
    SSLCertificateFile /etc/pki/tls/certs/flashlight-localhost.crt
    SSLCertificateKeyFile /etc/pki/tls/private/flashlight-localhost.key
    <Location />
        Require all denied
    </Location>
</VirtualHost>

# Administration: PostfixAdmin (/padmin) and phpMyAdmin (/myadmin), all behind a site password
<VirtualHost *:443>
    ServerName {AdminDomain}
    DocumentRoot /var/www/admin
    Alias /padmin "/var/www/admin/padmin/public"
    Alias /myadmin "/var/www/admin/phpmyadmin"
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/{MailDomain}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/{MailDomain}/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"
    <Directory "/var/www/admin">
        AuthType Basic
        AuthName "Restricted Content"
        AuthUserFile /var/www/admin/.htpasswd
        Require valid-user
    </Directory>
    # phpMyAdmin's internal folders are never opened from a browser (phpMyAdmin's own recommendation)
    <DirectoryMatch "^/var/www/admin/phpmyadmin/(setup|libraries|templates|tmp|vendor|sql)/">
        Require all denied
    </DirectoryMatch>
    # the spam filter's web interface at /rspamd/ (base.sh writes it with Antispam)
    IncludeOptional /etc/httpd/flashlight-rspamd.conf
    IncludeOptional /mnt/mailserver/etc/httpd/custom-admin.conf
</VirtualHost>

# Webmail: Roundcube
<VirtualHost *:443>
    ServerName {MailDomain}
    DocumentRoot /var/www/webmail/public_html
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/{MailDomain}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/{MailDomain}/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"
    IncludeOptional /mnt/mailserver/etc/httpd/custom-mail.conf
</VirtualHost>
