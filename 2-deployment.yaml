Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: "Network Configuration"
      Parameters:
      - DnsPreset
      - VpcCidr
      - SubnetMask
      - AZoneNames
      - TwoAZoneConf
    - Label:
        default: "Mail Server Configuration"
      Parameters:
      - AdminEmail
      - AlertEmail
      - TimeZone
      - Fail2ban
      - CertificateMode
      - InstanceType
      - InstanceType2
      - InstanceLifecycle
      - RebuildAfterDays
      - DiskVolumeSize
      - KeyName
    - Label:
        default: "Spam Filtering"
      Parameters:
      - Antispam
      - SpamhausDQSKey
      - AttachmentPolicy
      - Antivirus
    - Label:
        default: "Storage Configuration"
      Parameters:
      - MailStorageThroughputMode
      - MailStorageLifecyclePolicy
      - MailStorageBackupPolicy
Parameters:
  DnsPreset:
    Type: String
    Default: MailServerDnsPreset
    Description: MailServer DNS-Preset Stack name
  AdminEmail:
    Type: String
    Description: Email of MailServer Admin
  AlertEmail:
    Type: String
    Default: ''
    Description: >-
      Optional. Up to 3 addresses, separated by commas without spaces, that get an email when the server can't
      come back after an instance replacement. Use addresses on another mail service, not on this server: when
      it is down, it can't receive them. Each address gets a confirmation email from AWS Notifications; click
      its link within 48 hours. Empty: no alert emails
    AllowedPattern: '|[^\s,@]+@[^\s,@]+\.[^\s,@]+(,[^\s,@]+@[^\s,@]+\.[^\s,@]+){0,2}'
    ConstraintDescription: up to 3 email addresses separated by commas, without spaces
  TimeZone:
    Type: String
    Default: America/Chicago
    Description: Look up https://www.php.net/manual/en/timezones.php
  CertificateMode:
    Type: String
    Description: >-
      Let's Encrypt certificate. production: a trusted certificate (Let's Encrypt limits repeated issuance for
      the same names to a few per week). staging: an untrusted test certificate that doesn't count against
      those limits; use it for test deployments
    Default: production
    AllowedValues: [ production, staging ]
  Fail2ban:
    Type: String
    Description: Fail2ban bans IP addresses after repeated failed logins (SSH, mail, webmail)
    Default: ENABLED
    AllowedValues: [ ENABLED, DISABLED ]
  Antispam:
    Type: String
    Description: >-
      Spam filtering of incoming mail with Rspamd (about 300 MB of memory, fits t3a.small). Spam goes to the
      Junk folder, obvious spam is rejected
    Default: ENABLED
    AllowedValues: [ ENABLED, DISABLED ]
  SpamhausDQSKey:
    Type: String
    NoEcho: true
    Description: >-
      Optional: your key of Spamhaus Blocklists via DNS Query, free for small businesses
      (https://www.spamhaus.com/data-access/free-data-query-service/). Spamhaus noticeably improves filtering;
      without the key Rspamd works without it. Needs Antispam = ENABLED
    Default: ''
    AllowedPattern: '^\S*$'
    ConstraintDescription: must not contain spaces
  AttachmentPolicy:
    Type: String
    Description: >-
      Attachments of risky file types (with Antispam = ENABLED). Score: they only add points to the spam score
      (Rspamd's default). Gmail: mail with an attachment of a type Gmail blocks (exe, js, bat, iso, lnk...), also
      inside archives, is rejected, and encrypted archives go to Junk. Strict: Gmail plus more Windows code types
      from Outlook's blocked list (reg, url, inf, vhdx, PowerShell files...)
    Default: Score
    AllowedValues: [ Score, Gmail, Strict ]
  Antivirus:
    Type: String
    Description: >-
      Virus scanner ClamAV for incoming mail (with Antispam = ENABLED): a message with a virus is rejected. It
      needs about 1 GB of memory, 2 GB for a few seconds while it loads new signatures, so it needs a medium or
      larger instance type
    Default: DISABLED
    AllowedValues: [ ENABLED, DISABLED ]
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedValues: [ 10.0.0.0/16, 172.16.0.0/16, 192.168.0.0/16 ]
    Description: VPC CIDR
  SubnetMask:
    Type: String
    Default: 8
    AllowedValues: [ 8, 10, 12, 14 ]
    Description: Subnets mask size 8=/24, 10=/22, 12=/20, 14=/18
  AZoneNames:
    Type: 'List<AWS::EC2::AvailabilityZone::Name>'
    Description: Availability Zones (choose 3 availability zones, or 2 with TwoAZoneConf enabled)
  TwoAZoneConf:
    Type: String
    Description: Two-availability-zone configuration (not recommended), enable only in two-AZ regions
    Default: DISABLED
    AllowedValues: [ ENABLED, DISABLED ]
  InstanceType:
    Type: String
    Description: >-
      EC2 instance type. t3: CPU above a baseline is paid extra (CPU credits); c (2 GB per vCPU) and m (4 GB per
      vCPU): the whole CPU at all times. See "Choosing the instance type" in the install guide
    Default: t3.small
    AllowedValues: [ t3.small, t3.medium, t3.xlarge, c7i.large, c7i.xlarge, m7i.large, m7i.xlarge ]
  InstanceType2:
    Type: String
    Description: >-
      Second instance type, the pair of InstanceType: t3a for t3, c6a for c7i, m6a for m7i, the same size (with
      Spot the server runs on either one, whichever AWS has). None: only InstanceType
    Default: t3a.small
    AllowedValues: [ None, t3a.small, t3a.medium, t3a.xlarge, c6a.large, c6a.xlarge, m6a.large, m6a.xlarge ]
  InstanceLifecycle:
    Type: String
    Description: EC2 instance payment model
    Default: Spot
    AllowedValues: [ On-Demand, Spot ]
  RebuildAfterDays:
    Type: Number
    Description: >-
      Rebuild the server from scratch on current packages once it is this many days old: it is replaced on
      the first Saturday-to-Sunday night (03:15) after that age; mail is down for about 4 minutes. 0 turns it off
    Default: 30
    MinValue: 0
  DiskVolumeSize:
    Type: String
    Description: >-
      Server disk size (GiB): the system plus a swap file of half the memory (at most 4 GB). At least 10 for
      instance types with 2-4 GB of memory (t3.small, t3.medium, c7i.large), at least 12 for 8-16 GB (the others)
    Default: 10
    AllowedValues: [ 10, 12, 14, 16, 20, 24 ]
  MailStorageThroughputMode:
    Type: String
    Description: >-
      Mail Server Storage throughput mode. bursting (recommended): no extra cost and fine for a typical mail server,
      since a small file system never runs out of burst credits. elastic: you pay per GB read/written; choose it only if
      constant heavy traffic drains the burst credits (BurstCreditBalance metric in CloudWatch).
      Can be changed later by a stack update (once a day)
    Default: bursting
    AllowedValues: [ bursting, elastic ]
  MailStorageLifecyclePolicy:
    Type: String
    Description: Mail Server Storage lifecycle policy of transition files to the Infrequent Access (IA) storage class
    Default: AFTER_30_DAYS
    AllowedValues: [ None, AFTER_7_DAYS, AFTER_14_DAYS, AFTER_30_DAYS, AFTER_60_DAYS, AFTER_90_DAYS ]
  MailStorageBackupPolicy:
    Type: String
    Description: Mail Server Storage backup policy
    Default: DISABLED
    AllowedValues: [ ENABLED, DISABLED ]
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Key Name
    ConstraintDescription: must be the name of an existing EC2 KeyPair.
Rules:
  AntivirusNeedsAntispamAndMemory:
    RuleCondition: !Equals [ !Ref Antivirus, 'ENABLED' ]
    Assertions:
    - Assert: !Equals [ !Ref Antispam, 'ENABLED' ]
      AssertDescription: The virus scanner works inside the spam filter. Antivirus = ENABLED needs Antispam = ENABLED
    - Assert: !And
      - !Not [ !Equals [ !Ref InstanceType, 't3.small' ] ]
      - !Not [ !Equals [ !Ref InstanceType2, 't3a.small' ] ]
      AssertDescription: >-
        The virus scanner (ClamAV) needs about 1 GB of memory, 2 GB while it loads new signatures. Choose medium or
        larger instance types (InstanceType and InstanceType2) or Antivirus = DISABLED
  BigMemoryNeedsDisk:
    RuleCondition: !Contains [ [ 't3.xlarge', 'c7i.xlarge', 'm7i.large', 'm7i.xlarge' ], !Ref InstanceType ]
    Assertions:
    - Assert: !Not [ !Equals [ !Ref DiskVolumeSize, '10' ] ]
      AssertDescription: >-
        Instance types with 8 GB of memory or more get a 4 GB swap file and need a disk (DiskVolumeSize) of at
        least 12 GiB
  InstanceTypePairs:
    Assertions:
    - Assert: !Or
      - !Equals [ !Ref InstanceType2, 'None' ]
      - !And [ !Equals [ !Ref InstanceType, 't3.small' ], !Equals [ !Ref InstanceType2, 't3a.small' ] ]
      - !And [ !Equals [ !Ref InstanceType, 't3.medium' ], !Equals [ !Ref InstanceType2, 't3a.medium' ] ]
      - !And [ !Equals [ !Ref InstanceType, 't3.xlarge' ], !Equals [ !Ref InstanceType2, 't3a.xlarge' ] ]
      - !And [ !Equals [ !Ref InstanceType, 'c7i.large' ], !Equals [ !Ref InstanceType2, 'c6a.large' ] ]
      - !And [ !Equals [ !Ref InstanceType, 'c7i.xlarge' ], !Equals [ !Ref InstanceType2, 'c6a.xlarge' ] ]
      - !And [ !Equals [ !Ref InstanceType, 'm7i.large' ], !Equals [ !Ref InstanceType2, 'm6a.large' ] ]
      - !And [ !Equals [ !Ref InstanceType, 'm7i.xlarge' ], !Equals [ !Ref InstanceType2, 'm6a.xlarge' ] ]
      AssertDescription: >-
        InstanceType2 must be the pair of InstanceType, of the same size and memory: t3a for t3, c6a for c7i, m6a
        for m7i (t3.medium with t3a.medium, for example), or None
  SpamhausKeyNeedsAntispam:
    RuleCondition: !Equals [ !Ref Antispam, 'DISABLED' ]
    Assertions:
    - Assert: !Equals [ !Ref SpamhausDQSKey, '' ]
      AssertDescription: The Spamhaus DQS key works only with Antispam = ENABLED. Enable Antispam or clear the key
Conditions:
  ThreeAZoneConf: !Equals [ !Ref TwoAZoneConf, 'DISABLED' ]
  SpotInstance: !Equals [ !Ref InstanceLifecycle, 'Spot' ]
  SecondInstanceType: !Not [ !Equals [ !Ref InstanceType2, 'None' ] ]
  MailStorageIA: !Not [ !Equals [ !Ref MailStorageLifecyclePolicy, 'None' ] ]
  # AlertEmail: the alert system exists only with at least one address; two trailing commas let Fn::Select take
  # the 2nd and 3rd address even when there are fewer
  Alerts: !Not [ !Equals [ !Ref AlertEmail, '' ] ]
  AlertEmail2: !Not [ !Equals [ !Select [ 1, !Split [ ',', !Join [ '', [ !Ref AlertEmail, ',,' ] ] ] ], '' ] ]
  AlertEmail3: !Not [ !Equals [ !Select [ 2, !Split [ ',', !Join [ '', [ !Ref AlertEmail, ',,' ] ] ] ], '' ] ]
Resources:
  MailServerVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'
      InstanceTenancy: 'default'
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  MailServerInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MailServerVPC
      InternetGatewayId: !Ref MailServerInternetGateway
  PubSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MailServerVPC
      CidrBlock: !Select [ 0, !Cidr [ !GetAtt MailServerVPC.CidrBlock, 4, !Ref SubnetMask ] ]
      AvailabilityZone: !Select [ 0, !Ref AZoneNames ]
      MapPublicIpOnLaunch: 'true'
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  PubSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MailServerVPC
      CidrBlock: !Select [ 1, !Cidr [ !GetAtt MailServerVPC.CidrBlock, 4, !Ref SubnetMask ] ]
      AvailabilityZone: !Select [ 1, !Ref AZoneNames ]
      MapPublicIpOnLaunch: 'true'
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  PubSubnetC:
    Type: AWS::EC2::Subnet
    Condition: ThreeAZoneConf
    Properties:
      VpcId: !Ref MailServerVPC
      CidrBlock: !Select [ 2, !Cidr [ !GetAtt MailServerVPC.CidrBlock, 4, !Ref SubnetMask ] ]
      AvailabilityZone: !Select [ 2, !Ref AZoneNames ]
      MapPublicIpOnLaunch: 'true'
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MailServerVPC
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      GatewayId: !Ref MailServerInternetGateway
      DestinationCidrBlock: 0.0.0.0/0
  PubSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PubSubnetA
  PubSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PubSubnetB
  PubSubnetCRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: ThreeAZoneConf
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PubSubnetC
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mail-Server
      VpcId: !Ref MailServerVPC
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: 0.0.0.0/0
        Description: SSH
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
        Description: HTTP
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
        Description: HTTPS
      - IpProtocol: tcp
        FromPort: 25
        ToPort: 25
        CidrIp: 0.0.0.0/0
        Description: SMTP
      - IpProtocol: tcp
        FromPort: 465
        ToPort: 465
        CidrIp: 0.0.0.0/0
        Description: SMTP submission, implicit TLS (SSL/TLS)
      - IpProtocol: tcp
        FromPort: 587
        ToPort: 587
        CidrIp: 0.0.0.0/0
        Description: SMTP submission, STARTTLS
      - IpProtocol: tcp
        FromPort: 143
        ToPort: 143
        CidrIp: 0.0.0.0/0
        Description: IMAP, STARTTLS
      - IpProtocol: tcp
        FromPort: 993
        ToPort: 993
        CidrIp: 0.0.0.0/0
        Description: IMAPS, implicit TLS (SSL/TLS)
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
          Action: sts:AssumeRole
      Path: "/"
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
      Policies:
      - PolicyName: MailServerInstance
        PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Effect: Allow
            Action:
            - 'ec2:AssociateAddress'
            - 'ec2:DescribeSpotPriceHistory'
            # services-shutdown: is the instance that took over the EFS terminated?
            - 'ec2:DescribeInstances'
            Resource: '*'
          # DNS: TXT records only, in this stack's zones only. dnsupd.py writes DKIM, SPF and DMARC;
          # certbot's Route 53 plugin adds and removes the Let's Encrypt _acme-challenge records
          # (it also looks up the zone and waits until the change is on all Route 53 servers);
          # dnsupd.py reads a domain's TXT records to keep the strings that aren't ours (read-only, DNS is public anyway)
          - Effect: Allow
            Action: [ 'route53:ListHostedZones', 'route53:GetChange', 'route53:ListResourceRecordSets' ]
            Resource: '*'
          - Effect: Allow
            Action: 'route53:ChangeResourceRecordSets'
            Resource: !Split
            - ','
            - !Sub
              - 'arn:aws:route53:::hostedzone/${ZoneIds}'
              - ZoneIds: !Join
                - ',arn:aws:route53:::hostedzone/'
                - !Split
                  - ','
                  - Fn::ImportValue: !Sub "${DnsPreset}-DomainZoneIDs"
            Condition:
              'ForAllValues:StringEquals':
                'route53:ChangeResourceRecordSetsRecordTypes': 'TXT'
          - Effect: Allow
            Action: [ 'autoscaling:DescribeAutoScalingInstances', 'autoscaling:DescribeAutoScalingGroups' ]
            Resource: '*'
          # replace-instance: the instance may only ask its own stack's ASG (old or new one during an update) to replace it
          - Effect: Allow
            Action: 'autoscaling:TerminateInstanceInAutoScalingGroup'
            Resource: '*'
            Condition:
              StringEquals:
                'autoscaling:ResourceTag/Name': !Sub "${AWS::StackName}-Flashlight"
          - Effect: Allow
            Action: [ 'cloudformation:SignalResource', 'cloudformation:DescribeStacks' ]
            Resource: !Ref 'AWS::StackId'
          # install-finish: alert emails, and the check that the AlertEmail addresses are subscribed
          - !If
            - Alerts
            - Effect: Allow
              Action: [ 'sns:Publish', 'sns:ListSubscriptionsByTopic' ]
              Resource: !Ref AlertTopic
            - !Ref 'AWS::NoValue'
          # Config bucket: read everything, list it (checks for a missing file, the count of failed installs), write
          # the logs of failed installs, and full access to the admin's own upload/ folder. Installer files can't be
          # changed or deleted, so a compromised server can't plant a modified installer for the next instances.
          - Effect: Allow
            Action: 's3:ListBucket'
            Resource:
              - Fn::Join:
                - ''
                - - 'arn:aws:s3:::'
                  - Fn::ImportValue: !Sub "${DnsPreset}-S3Bucket"
          - Effect: Allow
            Action: 's3:GetObject'
            Resource:
              - Fn::Join:
                - ''
                - - 'arn:aws:s3:::'
                  - Fn::ImportValue: !Sub "${DnsPreset}-S3Bucket"
                  - '/*'
          - Effect: Allow
            Action: 's3:PutObject'
            Resource:
              - Fn::Join:
                - ''
                - - 'arn:aws:s3:::'
                  - Fn::ImportValue: !Sub "${DnsPreset}-S3Bucket"
                  - '/install-logs/*'
          # (on an object ARN, s3:* covers only object actions: read, write, delete, multipart uploads)
          - Effect: Allow
            Action: 's3:*'
            Resource:
              - Fn::Join:
                - ''
                - - 'arn:aws:s3:::'
                  - Fn::ImportValue: !Sub "${DnsPreset}-S3Bucket"
                  - '/upload/*'
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles: [ !Ref InstanceRole ]
  # Waits for all EFS mount targets, so no instance starts in a zone whose mount target isn't ready yet.
  # DependsOn can't name MailStorageMountTargetC: with two zones it doesn't exist and the template is rejected.
  # A reference inside Fn::If creates a dependency only when its condition is true, and this empty resource
  # (it costs nothing) carries that reference; the LaunchTemplate then depends on it.
  MailStorageMountTargets:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      MountTargetC: !If [ ThreeAZoneConf, !Ref MailStorageMountTargetC, 'none (two zones)' ]
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn: [ MailStorageMountTargetA, MailStorageMountTargetB, MailStorageMountTargets ]
    Properties:
      LaunchTemplateData:
        # The instance types and Spot/On-Demand are settings of the Auto Scaling group (MixedInstancesPolicy), and
        # a change there alone applies only to the next instance the group starts. As tags here they also make a new
        # template version, so a stack update that changes them replaces the server like any other setting.
        TagSpecifications:
        - ResourceType: instance
          Tags:
          - Key: 'flashlight:instance-types'
            Value: !If [ SecondInstanceType, !Sub "${InstanceType},${InstanceType2}", !Ref InstanceType ]
          - Key: 'flashlight:lifecycle'
            Value: !Ref InstanceLifecycle
        ImageId:
          Fn::ImportValue: !Sub "${DnsPreset}-ImageId"
        KeyName: !Ref KeyName
        InstanceInitiatedShutdownBehavior: terminate
        SecurityGroupIds: [ !Ref InstanceSecurityGroup ]
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref DiskVolumeSize
            VolumeType: gp3
            # with the AWS managed key: install logs and swap hold secrets
            Encrypted: true
        UserData:
          Fn::Base64: !Sub
          - |
            #!/bin/bash -x
            #
            # Defining variables
            export EIP_ID=${eipid}
            export EIP=${eip}
            export AWS_REGION=${AWS::Region}
            export STACK=${AWS::StackName}
            export MAIL_STORAGE=${MailStorage}
            export BUCKET_CONFIG=${bucketconfig}
            export INSTANCE_LIFECYCLE=${InstanceLifecycle}
            export REBUILD_AFTER_DAYS=${RebuildAfterDays}
            export ALERT_TOPIC=${alerttopic}
            #
            export TIMEZONE=${TimeZone}
            export ADMIN_EMAIL=${AdminEmail}
            export FAIL2BAN=${Fail2ban}
            export ANTISPAM=${Antispam}
            export DQS_KEY=${SpamhausDQSKey}
            export ATTACHMENT_POLICY=${AttachmentPolicy}
            export ANTIVIRUS=${Antivirus}
            export CERT_MODE=${CertificateMode}
            #
            export DOMAIN_ZONE_IDS=${domainzoneids}
            export DOMAIN_NAMES=${domainnames}
            export ADMIN_DOMAIN=${admindomain}
            export MAIL_DOMAIN=${maildomain}
            #
            # Disabling SELinux
            setenforce 0
            sed -i 's/=enforcing/=disabled/' /etc/selinux/config
            # On EL10 the config alone only unloads the policy, selinux=0 turns SELinux off completely
            grubby --update-kernel ALL --args selinux=0
            #
            # Disabling yes requests for rm/mv/cp commands
            sed -i 's/alias/#alias/' /root/.*hrc
            #
            # Install scripts log to a root-only file: their -x trace contains generated passwords,
            # and anything printed here also goes to the systemd journal and the EC2 console log
            install -m 600 /dev/null /var/log/flashlight-install.log
            #
            # AWS calls made as root (AWS CLI here and in base.sh, boto3 scripts, cron jobs) retry temporary
            # errors up to 6 times with growing pauses: a failed download would stop an unattended install
            mkdir -p /root/.aws
            printf '[default]\nretry_mode = standard\nmax_attempts = 6\n' > /root/.aws/config
            #
            # OS of the image itself, before the update (recorded in /mnt/mailserver/versions)
            export IMAGE_OS="$(. /etc/os-release && echo "$PRETTY_NAME")"
            #
            # Updating the OS first, so everything below is installed and configured on the current
            # package versions (a new kernel starts with the reboot at the end)
            dnf upgrade -y >> /var/log/flashlight-install.log 2>&1
            echo "dnf upgrade finished with code $? (details: /var/log/flashlight-install.log)"
            #
            # Installing awscli (AlmaLinux AppStream package)
            cd ~
            dnf install -y awscli2
            #
            # install-finish decides what happens after the install (READY, or FAILED with retries/rollback)
            aws s3 cp s3://${bucketconfig}/install-finish /usr/local/sbin/
            chmod 700 /usr/local/sbin/install-finish
            #
            # Deploying base software. A hung install (a download that never ends, for example) is stopped after
            # 60 minutes and fails like any other, so install-finish retries it and sends the alerts (a normal
            # install takes 8-15 minutes)
            aws s3 cp s3://${bucketconfig}/base.sh /root
            chmod 744 /root/base.sh
            timeout -k 1m 60m /root/base.sh >> /var/log/flashlight-install.log 2>&1
            base_rc=$?
            [ $base_rc -eq 124 ] && echo "base.sh stopped: still running after 60 minutes" | tee -a /var/log/flashlight-install.log
            echo "base.sh finished with code $base_rc (details: /var/log/flashlight-install.log)"
            rm /root/base.sh
            #
            # Deploying user script if presented (optional: its failure is reported but doesn't fail the install)
            user_rc=""
            aws s3 ls s3://${bucketconfig}/user-script.sh
            if [ $? -eq 0 ]; then
              echo "user-script.sh is presented (applying user configuration)..."
              aws s3 cp s3://${bucketconfig}/user-script.sh /root
              chmod 744 /root/user-script.sh
              /root/user-script.sh >> /var/log/flashlight-install.log 2>&1
              user_rc=$?
              echo "user-script.sh finished with code $user_rc (details: /var/log/flashlight-install.log)"
              rm /root/user-script.sh
            else
              echo "user-script.sh is not presented (no additional user configuration)"
            fi
            #
            # Install result: keeps the install log, writes the EFS flag after a good install (READY follows the
            # reboot), or reports FAILED and then fails the stack operation or retries on a new instance
            if [ ! -x /usr/local/sbin/install-finish ]; then
              # Nothing above worked (no AWS CLI, or the config bucket can't be read), so install-finish can't
              # report it. An alert email goes out here (AlertEmail), through the AWS CLI or, without it, through
              # curl. Then the instance turns itself off in 30 minutes, which terminates it, and the Auto Scaling
              # group starts a new one (an email about every 35 minutes until an install works); a stack
              # operation fails by its timeout.
              echo "install-finish is missing: the install can't run, shutting down in 30 minutes"
              # no trace from here: it would put the instance role's keys into the system log
              set +x
              if [ -n "$ALERT_TOPIC" ]; then
                md=http://169.254.169.254/latest/meta-data
                token=$(curl -s -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
                id=$(curl -s -H "X-aws-ec2-metadata-token: $token" $md/instance-id)
                subject="Flashlight ${maildomain}: the install can't start on a new instance"
                message="The mail server can't install on a new instance: the AWS CLI or the config bucket ${bucketconfig}
            is not available. The instance shuts down in 30 minutes and the Auto Scaling group starts a new one, which
            tries again; this email repeats until an install works.

            Stack: ${AWS::StackName} (${AWS::Region})
            Instance: $id
            Details: EC2 console, the instance, Actions > Monitor and troubleshoot > Get system log"
                if command -v aws > /dev/null; then
                  aws sns publish --region ${AWS::Region} --topic-arn "$ALERT_TOPIC" --subject "$subject" --message "$message"
                else
                  # the instance role's temporary keys from the instance metadata; curl signs the request (SigV4)
                  role=$(curl -s -H "X-aws-ec2-metadata-token: $token" $md/iam/security-credentials/)
                  creds=$(curl -s -H "X-aws-ec2-metadata-token: $token" $md/iam/security-credentials/$role)
                  key() { sed -n "s/.*\"$1\" *: *\"\([^\"]*\)\".*/\1/p" <<< "$creds"; }
                  curl -s --aws-sigv4 "aws:amz:${AWS::Region}:sns" --user "$(key AccessKeyId):$(key SecretAccessKey)" \
                    -H "X-Amz-Security-Token: $(key Token)" --data-urlencode Action=Publish \
                    --data-urlencode Version=2010-03-31 --data-urlencode "TopicArn=$ALERT_TOPIC" \
                    --data-urlencode "Subject=$subject" --data-urlencode "Message=$message" \
                    https://sns.${AWS::Region}.amazonaws.com/
                fi
              fi
              sleep 1800
              shutdown -h now
              exit 1
            fi
            /usr/local/sbin/install-finish result $base_rc $user_rc >> /var/log/flashlight-install.log 2>&1
            # A good install reboots (new kernel and kernel settings; READY follows). A failed one doesn't: after
            # a reboot the services configured before the failure would start, on a half-configured server
            [ "$base_rc" = 0 ] && reboot
          - eipid:
              Fn::ImportValue: !Sub "${DnsPreset}-EipID"
            eip:
              Fn::ImportValue: !Sub "${DnsPreset}-Eip"
            bucketconfig:
              Fn::ImportValue: !Sub "${DnsPreset}-S3Bucket"
            maildomain:
              Fn::ImportValue: !Sub "${DnsPreset}-DNSRecMail"
            admindomain:
              Fn::ImportValue: !Sub "${DnsPreset}-DNSRecAdmin"
            domainnames:
              Fn::ImportValue: !Sub "${DnsPreset}-DomainNames"
            domainzoneids:
              Fn::ImportValue: !Sub "${DnsPreset}-DomainZoneIDs"
            alerttopic: !If [ Alerts, !Ref AlertTopic, '' ]
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingReplacingUpdate:
        WillReplace: True
    # an install takes 4 to 12 minutes (slower instance types, regions and package mirrors), with a reserve
    CreationPolicy:
      ResourceSignal:
        Timeout: PT30M
    Properties:
      DesiredCapacity: 1
      MinSize: 1
      # one mail server per storage: replacements (spot, price check, scheduled rebuild) terminate first,
      # then the ASG launches the new instance; a stack update creates a separate ASG
      MaxSize: 1
      VPCZoneIdentifier: [ !Ref PubSubnetA, !Ref PubSubnetB, !If [ ThreeAZoneConf, !Ref PubSubnetC, !Ref 'AWS::NoValue' ] ]
      TerminationPolicies: [ OldestInstance ]
      # the count of running instances, for the NoInstanceAlarm (group metrics cost nothing)
      MetricsCollection: !If
      - Alerts
      - - Granularity: 1Minute
          Metrics: [ GroupInServiceInstances ]
      - !Ref 'AWS::NoValue'
      MixedInstancesPolicy:
        InstancesDistribution:
          OnDemandPercentageAboveBaseCapacity: !If [ SpotInstance, 0, 100 ]
          # cheap pools that are also least likely to be interrupted (AWS recommendation)
          SpotAllocationStrategy: !If [ SpotInstance, 'price-capacity-optimized', !Ref 'AWS::NoValue' ]
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref LaunchTemplate
            Version: !GetAtt LaunchTemplate.LatestVersionNumber
          Overrides:
          - InstanceType: !Ref InstanceType
          - InstanceType: !If [ SecondInstanceType, !Ref InstanceType2, !Ref 'AWS::NoValue' ]
      Tags:
      - Key: Name
        PropagateAtLaunch: True
        Value: !Sub "${AWS::StackName}-Flashlight"
  # Alert emails (AlertEmail). Senders: install-finish on the instance (an install after a replacement failed,
  # or worked after failures; the subscription check), UserData when install-finish is missing, and the
  # NoInstanceAlarm. Maintenance mode keeps the topic and the subscriptions, but not the alarm (no group).
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: Alerts
    Properties:
      # the sender's name in the emails (at most 100 characters, so not the stack name; the subjects name the server)
      DisplayName: Flashlight alerts
  # Subscriptions follow the position in AlertEmail: removing the first address re-creates the ones after it,
  # which then need a new confirmation
  AlertSubscription1:
    Type: AWS::SNS::Subscription
    Condition: Alerts
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Select [ 0, !Split [ ',', !Ref AlertEmail ] ]
  AlertSubscription2:
    Type: AWS::SNS::Subscription
    Condition: AlertEmail2
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Select [ 1, !Split [ ',', !Ref AlertEmail ] ]
  AlertSubscription3:
    Type: AWS::SNS::Subscription
    Condition: AlertEmail3
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Select [ 2, !Split [ ',', !Ref AlertEmail ] ]
  # No running instance for 15 minutes: AWS can't start one (no free capacity for the instance types, Spot or
  # On-Demand). A normal replacement leaves the group empty for a few minutes only. One email when it starts
  # (ALARM), one when an instance runs again (OK).
  NoInstanceAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: Alerts
    Properties:
      AlarmName: !Sub "${AWS::StackName}-no-mail-server-instance"
      AlarmDescription: !Sub >-
        Flashlight ${AWS::StackName}: the mail server has had no running instance for 15 minutes; AWS can't
        start one. The reason is in the EC2 console, Auto Scaling groups, the group ${AWS::StackName}-..., Activity
        tab (for example "no Spot capacity" or "insufficient capacity" for the instance types). The group keeps
        trying. To get a server sooner, update the stack with InstanceLifecycle = On-Demand, or with
        InstanceType2 set (a second instance type).
      Namespace: AWS/AutoScaling
      MetricName: GroupInServiceInstances
      Dimensions:
      - Name: AutoScalingGroupName
        Value: !Ref AutoScalingGroup
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 15
      DatapointsToAlarm: 15
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # no data yet (a new group): not an alarm
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlertTopic ]
      OKActions: [ !Ref AlertTopic ]
  MailStorageSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mail-Storage
      VpcId: !Ref MailServerVPC
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 2049
        ToPort: 2049
        SourceSecurityGroupId: !GetAtt InstanceSecurityGroup.GroupId
  MailStorageMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref MailStorage
      SecurityGroups: [ !Ref MailStorageSecurityGroup ]
      SubnetId: !Ref PubSubnetA
  MailStorageMountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref MailStorage
      SecurityGroups: [ !Ref MailStorageSecurityGroup ]
      SubnetId: !Ref PubSubnetB
  MailStorageMountTargetC:
    Type: AWS::EFS::MountTarget
    Condition: ThreeAZoneConf
    Properties:
      FileSystemId: !Ref MailStorage
      SecurityGroups: [ !Ref MailStorageSecurityGroup ]
      SubnetId: !Ref PubSubnetC
  MailStorage:
    Type: AWS::EFS::FileSystem
    # The mail storage outlives the stack: deleting the stack (or replacing this resource) leaves the file system
    # with all mail and databases in the account, to be deleted by hand in the EFS console. (ExceptOnCreate: a
    # failed first creation of the stack still cleans up its empty file system.)
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      # the name in the EFS console; it stays after the stack is deleted and tells whose file system it is
      FileSystemTags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
      Encrypted: True
      PerformanceMode: generalPurpose
      ThroughputMode: !Ref MailStorageThroughputMode
      LifecyclePolicies: !If
      - MailStorageIA
      - - TransitionToIA: !Ref MailStorageLifecyclePolicy
        - TransitionToPrimaryStorageClass: AFTER_1_ACCESS
      - !Ref 'AWS::NoValue'
      BackupPolicy:
        Status: !Ref MailStorageBackupPolicy
