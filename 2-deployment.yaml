Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: "Network Configuration"
      Parameters:
      - DnsPreset
      - VpcCidr
      - SubnetMask
      - AZoneNames
      - TwoAZoneConf
    - Label:
        default: "Mail Server Configuration"
      Parameters:
      - AdminEmail
      - TimeZone
      - Fail2ban
      - CertificateMode
      - InstanceType
      - InstanceType2
      - InstanceLifecycle
      - RebuildAfterDays
      - DiskVolumeSize
      - KeyName
    - Label:
        default: "Storage Configuration"
      Parameters:
      - MailStorageThroughputMode
      - MailStorageLifecyclePolicy
      - MailStorageBackupPolicy
Parameters:
  DnsPreset:
    Type: String
    Default: MailServerDnsPreset
    Description: MailServer DNS-Preset Stack name
  AdminEmail:
    Type: String
    Description: Email of MailServer Admin
  TimeZone:
    Type: String
    Default: America/Chicago
    Description: Look up https://www.php.net/manual/en/timezones.php
  CertificateMode:
    Type: String
    Description: >-
      Let's Encrypt certificate. production: a trusted certificate (Let's Encrypt limits repeated issuance for
      the same names to a few per week). staging: an untrusted test certificate that doesn't count against
      those limits; use it for test deployments
    Default: production
    AllowedValues: [ production, staging ]
  Fail2ban:
    Type: String
    Description: Fail2ban package
    Default: DISABLED
    AllowedValues: [ ENABLED, DISABLED ]
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedValues: [ 10.0.0.0/16, 172.16.0.0/16, 192.168.0.0/16 ]
    Description: VPC CIDR
  SubnetMask:
    Type: String
    Default: 8
    AllowedValues: [ 8, 10, 12, 14 ]
    Description: Subnets mask size 8=/24, 10=/22, 12=/20, 14=/18
  AZoneNames:
    Type: 'List<AWS::EC2::AvailabilityZone::Name>'
    Description: Availability Zones (choose 3 availability zones, or 2 with TwoAZoneConf enabled)
  TwoAZoneConf:
    Type: String
    Description: Two-availability-zone configuration (not recommended), enable only in two-AZ regions
    Default: DISABLED
    AllowedValues: [ ENABLED, DISABLED ]
  InstanceType:
    Type: String
    Description: EC2 instance type
    Default: t3a.small
    AllowedValues: [ t3a.small, t3a.medium, t3a.large, t3a.xlarge ]
  InstanceType2:
    Type: String
    Description: EC2 additional instance type
    Default: t3.small
    AllowedValues: [ None, t3.small, t3.medium, t3.large, t3.xlarge ]
  InstanceLifecycle:
    Type: String
    Description: EC2 instance payment model
    Default: Spot
    AllowedValues: [ On-Demand, Spot ]
  RebuildAfterDays:
    Type: Number
    Description: >-
      Rebuild the server from scratch on current packages once it is this many days old: it is replaced on
      the first Saturday-to-Sunday night (03:15) after that age; mail is down for about 4 minutes. 0 turns it off
    Default: 30
    MinValue: 0
  DiskVolumeSize:
    Type: String
    Description: Disk volume size (GiB)
    Default: 6
    AllowedValues: [ 5, 6, 8, 16, 32 ]
  MailStorageThroughputMode:
    Type: String
    Description: >-
      Mail Server Storage throughput mode. bursting (recommended): no extra cost and fine for a typical mail server,
      since a small file system never runs out of burst credits. elastic: you pay per GB read/written; choose it only if
      constant heavy traffic drains the burst credits (BurstCreditBalance metric in CloudWatch).
      Can be changed later by a stack update (once a day)
    Default: bursting
    AllowedValues: [ bursting, elastic ]
  MailStorageLifecyclePolicy:
    Type: String
    Description: Mail Server Storage lifecycle policy of transition files to the Infrequent Access (IA) storage class
    Default: AFTER_30_DAYS
    AllowedValues: [ None, AFTER_7_DAYS, AFTER_14_DAYS, AFTER_30_DAYS, AFTER_60_DAYS, AFTER_90_DAYS ]
  MailStorageBackupPolicy:
    Type: String
    Description: Mail Server Storage backup policy
    Default: DISABLED
    AllowedValues: [ ENABLED, DISABLED ]
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Key Name
    ConstraintDescription: must be the name of an existing EC2 KeyPair.
Conditions:
  ThreeAZoneConf: !Equals [ !Ref TwoAZoneConf, 'DISABLED' ]
  SpotInstance: !Equals [ !Ref InstanceLifecycle, 'Spot' ]
  SecondInstanceType: !Not [ !Equals [ !Ref InstanceType2, 'None' ] ]
  MailStorageIA: !Not [ !Equals [ !Ref MailStorageLifecyclePolicy, 'None' ] ]
Resources:
  MailServerVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'
      InstanceTenancy: 'default'
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  MailServerInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MailServerVPC
      InternetGatewayId: !Ref MailServerInternetGateway
  PubSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MailServerVPC
      CidrBlock: !Select [ 0, !Cidr [ !GetAtt MailServerVPC.CidrBlock, 4, !Ref SubnetMask ] ]
      AvailabilityZone: !Select [ 0, !Ref AZoneNames ]
      MapPublicIpOnLaunch: 'true'
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  PubSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MailServerVPC
      CidrBlock: !Select [ 1, !Cidr [ !GetAtt MailServerVPC.CidrBlock, 4, !Ref SubnetMask ] ]
      AvailabilityZone: !Select [ 1, !Ref AZoneNames ]
      MapPublicIpOnLaunch: 'true'
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  PubSubnetC:
    Type: AWS::EC2::Subnet
    Condition: ThreeAZoneConf
    Properties:
      VpcId: !Ref MailServerVPC
      CidrBlock: !Select [ 2, !Cidr [ !GetAtt MailServerVPC.CidrBlock, 4, !Ref SubnetMask ] ]
      AvailabilityZone: !Select [ 2, !Ref AZoneNames ]
      MapPublicIpOnLaunch: 'true'
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MailServerVPC
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      GatewayId: !Ref MailServerInternetGateway
      DestinationCidrBlock: 0.0.0.0/0
  PubSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PubSubnetA
  PubSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PubSubnetB
  PubSubnetCRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: ThreeAZoneConf
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PubSubnetC
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mail-Server
      VpcId: !Ref MailServerVPC
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: 0.0.0.0/0
        Description: SSH
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
        Description: HTTP
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
        Description: HTTPS
      - IpProtocol: tcp
        FromPort: 25
        ToPort: 25
        CidrIp: 0.0.0.0/0
        Description: SMTP
      - IpProtocol: tcp
        FromPort: 465
        ToPort: 465
        CidrIp: 0.0.0.0/0
        Description: SMTPS (SSL) legacy
      - IpProtocol: tcp
        FromPort: 587
        ToPort: 587
        CidrIp: 0.0.0.0/0
        Description: SMTPS (TLS)
      - IpProtocol: tcp
        FromPort: 143
        ToPort: 143
        CidrIp: 0.0.0.0/0
        Description: IMAP (TLS)
      - IpProtocol: tcp
        FromPort: 993
        ToPort: 993
        CidrIp: 0.0.0.0/0
        Description: IMAPS (SSL)
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
          Action: sts:AssumeRole
      Path: "/"
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
      Policies:
      - PolicyName: MailServerInstance
        PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Effect: Allow
            Action:
            - 'ec2:AssociateAddress'
            - 'ec2:DescribeSpotPriceHistory'
            # services-shutdown: is the instance that took over the EFS terminated?
            - 'ec2:DescribeInstances'
            Resource: '*'
          # DNS: TXT records only, in this stack's zones only. dnsupd.py writes DKIM, SPF and DMARC;
          # certbot's Route 53 plugin adds and removes the Let's Encrypt _acme-challenge records
          # (it also looks up the zone and waits until the change is on all Route 53 servers);
          # dnsupd.py reads a domain's TXT records to keep the strings that aren't ours (read-only, DNS is public anyway)
          - Effect: Allow
            Action: [ 'route53:ListHostedZones', 'route53:GetChange', 'route53:ListResourceRecordSets' ]
            Resource: '*'
          - Effect: Allow
            Action: 'route53:ChangeResourceRecordSets'
            Resource: !Split
            - ','
            - !Sub
              - 'arn:aws:route53:::hostedzone/${ZoneIds}'
              - ZoneIds: !Join
                - ',arn:aws:route53:::hostedzone/'
                - !Split
                  - ','
                  - Fn::ImportValue: !Sub "${DnsPreset}-DomainZoneIDs"
            Condition:
              'ForAllValues:StringEquals':
                'route53:ChangeResourceRecordSetsRecordTypes': 'TXT'
          - Effect: Allow
            Action: [ 'autoscaling:DescribeAutoScalingInstances', 'autoscaling:DescribeAutoScalingGroups' ]
            Resource: '*'
          # replace-instance: the instance may only ask its own stack's ASG (old or new one during an update) to replace it
          - Effect: Allow
            Action: 'autoscaling:TerminateInstanceInAutoScalingGroup'
            Resource: '*'
            Condition:
              StringEquals:
                'autoscaling:ResourceTag/Name': !Sub "${AWS::StackName}-Flashlight"
          - Effect: Allow
            Action: [ 'cloudformation:SignalResource', 'cloudformation:DescribeStacks' ]
            Resource: !Ref 'AWS::StackId'
          # Config bucket: read everything, list it (checks for a missing file, the count of failed installs), write
          # the logs of failed installs, and full access to the admin's own upload/ folder. Installer files can't be
          # changed or deleted, so a compromised server can't plant a modified installer for the next instances.
          - Effect: Allow
            Action: 's3:ListBucket'
            Resource:
              - Fn::Join:
                - ''
                - - 'arn:aws:s3:::'
                  - Fn::ImportValue: !Sub "${DnsPreset}-S3Bucket"
          - Effect: Allow
            Action: 's3:GetObject'
            Resource:
              - Fn::Join:
                - ''
                - - 'arn:aws:s3:::'
                  - Fn::ImportValue: !Sub "${DnsPreset}-S3Bucket"
                  - '/*'
          - Effect: Allow
            Action: 's3:PutObject'
            Resource:
              - Fn::Join:
                - ''
                - - 'arn:aws:s3:::'
                  - Fn::ImportValue: !Sub "${DnsPreset}-S3Bucket"
                  - '/install-logs/*'
          # (on an object ARN, s3:* covers only object actions: read, write, delete, multipart uploads)
          - Effect: Allow
            Action: 's3:*'
            Resource:
              - Fn::Join:
                - ''
                - - 'arn:aws:s3:::'
                  - Fn::ImportValue: !Sub "${DnsPreset}-S3Bucket"
                  - '/upload/*'
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles: [ !Ref InstanceRole ]
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn: [ MailStorageMountTargetA, MailStorageMountTargetB ]
    Properties:
      LaunchTemplateData:
        ImageId:
          Fn::ImportValue: !Sub "${DnsPreset}-ImageId"
        KeyName: !Ref KeyName
        InstanceInitiatedShutdownBehavior: terminate
        SecurityGroupIds: [ !Ref InstanceSecurityGroup ]
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref DiskVolumeSize
            VolumeType: gp3
        UserData:
          Fn::Base64: !Sub
          - |
            #!/bin/bash -x
            #
            # Defining variables
            export EIP_ID=${eipid}
            export EIP=${eip}
            export AWS_REGION=${AWS::Region}
            export STACK=${AWS::StackName}
            export MAIL_STORAGE=${MailStorage}
            export BUCKET_CONFIG=${bucketconfig}
            export INSTANCE_LIFECYCLE=${InstanceLifecycle}
            export REBUILD_AFTER_DAYS=${RebuildAfterDays}
            #
            export TIMEZONE=${TimeZone}
            export ADMIN_EMAIL=${AdminEmail}
            export FAIL2BAN=${Fail2ban}
            export CERT_MODE=${CertificateMode}
            #
            export DOMAIN_ZONE_IDS=${domainzoneids}
            export DOMAIN_NAMES=${domainnames}
            export ADMIN_DOMAIN=${admindomain}
            export MAIL_DOMAIN=${maildomain}
            #
            # Disabling SELinux
            setenforce 0
            sed -i 's/=enforcing/=disabled/' /etc/selinux/config
            # On EL10 the config alone only unloads the policy, selinux=0 turns SELinux off completely
            grubby --update-kernel ALL --args selinux=0
            #
            # Disabling yes requests for rm/mv/cp commands
            sed -i 's/alias/#alias/' /root/.*hrc
            #
            # Install scripts log to a root-only file: their -x trace contains generated passwords,
            # and anything printed here also goes to the systemd journal and the EC2 console log
            install -m 600 /dev/null /var/log/flashlight-install.log
            #
            # AWS calls made as root (AWS CLI here and in base.sh, boto3 scripts, cron jobs) retry temporary
            # errors up to 6 times with growing pauses: a failed download would stop an unattended install
            mkdir -p /root/.aws
            printf '[default]\nretry_mode = standard\nmax_attempts = 6\n' > /root/.aws/config
            #
            # OS of the image itself, before the update (recorded in /mnt/mailserver/versions)
            export IMAGE_OS="$(. /etc/os-release && echo "$PRETTY_NAME")"
            #
            # Updating the OS first, so everything below is installed and configured on the current
            # package versions (a new kernel starts with the reboot at the end)
            dnf upgrade -y >> /var/log/flashlight-install.log 2>&1
            echo "dnf upgrade finished with code $? (details: /var/log/flashlight-install.log)"
            #
            # Installing awscli (AlmaLinux AppStream package)
            cd ~
            dnf install -y awscli2
            #
            # install-finish decides what happens after the install (READY, or FAILED with retries/rollback)
            aws s3 cp s3://${bucketconfig}/install-finish /usr/local/sbin/
            chmod 700 /usr/local/sbin/install-finish
            #
            # Deploying base software
            aws s3 cp s3://${bucketconfig}/base.sh /root
            chmod 744 /root/base.sh
            /root/base.sh >> /var/log/flashlight-install.log 2>&1
            base_rc=$?
            echo "base.sh finished with code $base_rc (details: /var/log/flashlight-install.log)"
            rm /root/base.sh
            #
            # Deploying user script if presented (optional: its failure is reported but doesn't fail the install)
            user_rc=""
            aws s3 ls s3://${bucketconfig}/user-script.sh
            if [ $? -eq 0 ]; then
              echo "user-script.sh is presented (applying user configuration)..."
              aws s3 cp s3://${bucketconfig}/user-script.sh /root
              chmod 744 /root/user-script.sh
              /root/user-script.sh >> /var/log/flashlight-install.log 2>&1
              user_rc=$?
              echo "user-script.sh finished with code $user_rc (details: /var/log/flashlight-install.log)"
              rm /root/user-script.sh
            else
              echo "user-script.sh is not presented (no additional user configuration)"
            fi
            #
            # Install result: keeps the install log, writes the EFS flag after a good install (READY follows the
            # reboot), or reports FAILED and then fails the stack operation or retries on a new instance
            [ -x /usr/local/sbin/install-finish ] && \
              /usr/local/sbin/install-finish result $base_rc $user_rc >> /var/log/flashlight-install.log 2>&1
            reboot
          - eipid:
              Fn::ImportValue: !Sub "${DnsPreset}-EipID"
            eip:
              Fn::ImportValue: !Sub "${DnsPreset}-Eip"
            bucketconfig:
              Fn::ImportValue: !Sub "${DnsPreset}-S3Bucket"
            maildomain:
              Fn::ImportValue: !Sub "${DnsPreset}-DNSRecMail"
            admindomain:
              Fn::ImportValue: !Sub "${DnsPreset}-DNSRecAdmin"
            domainnames:
              Fn::ImportValue: !Sub "${DnsPreset}-DomainNames"
            domainzoneids:
              Fn::ImportValue: !Sub "${DnsPreset}-DomainZoneIDs"
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingReplacingUpdate:
        WillReplace: True
    CreationPolicy:
      ResourceSignal:
        Timeout: PT20M
    Properties:
      DesiredCapacity: 1
      MinSize: 1
      # one mail server per storage: replacements (spot, price check, scheduled rebuild) terminate first,
      # then the ASG launches the new instance; a stack update creates a separate ASG
      MaxSize: 1
      VPCZoneIdentifier: [ !Ref PubSubnetA, !Ref PubSubnetB, !If [ ThreeAZoneConf, !Ref PubSubnetC, !Ref 'AWS::NoValue' ] ]
      TerminationPolicies: [ OldestInstance ]
      MixedInstancesPolicy:
        InstancesDistribution:
          OnDemandPercentageAboveBaseCapacity: !If [ SpotInstance, 0, 100 ]
          # cheap pools that are also least likely to be interrupted (AWS recommendation)
          SpotAllocationStrategy: !If [ SpotInstance, 'price-capacity-optimized', !Ref 'AWS::NoValue' ]
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref LaunchTemplate
            Version: !GetAtt LaunchTemplate.LatestVersionNumber
          Overrides:
          - InstanceType: !Ref InstanceType
          - InstanceType: !If [ SecondInstanceType, !Ref InstanceType2, !Ref 'AWS::NoValue' ]
      Tags:
      - Key: Name
        PropagateAtLaunch: True
        Value: !Sub "${AWS::StackName}-Flashlight"
  MailStorageSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mail-Storage
      VpcId: !Ref MailServerVPC
      Tags:
      - Key: Name
        Value: !Sub "${AWS::StackName}-Flashlight"
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 2049
        ToPort: 2049
        SourceSecurityGroupId: !GetAtt InstanceSecurityGroup.GroupId
  MailStorageMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref MailStorage
      SecurityGroups: [ !Ref MailStorageSecurityGroup ]
      SubnetId: !Ref PubSubnetA
  MailStorageMountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref MailStorage
      SecurityGroups: [ !Ref MailStorageSecurityGroup ]
      SubnetId: !Ref PubSubnetB
  MailStorageMountTargetC:
    Type: AWS::EFS::MountTarget
    Condition: ThreeAZoneConf
    Properties:
      FileSystemId: !Ref MailStorage
      SecurityGroups: [ !Ref MailStorageSecurityGroup ]
      SubnetId: !Ref PubSubnetC
  MailStorage:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: True
      PerformanceMode: generalPurpose
      ThroughputMode: !Ref MailStorageThroughputMode
      LifecyclePolicies: !If
      - MailStorageIA
      - - TransitionToIA: !Ref MailStorageLifecyclePolicy
        - TransitionToPrimaryStorageClass: AFTER_1_ACCESS
      - !Ref 'AWS::NoValue'
      BackupPolicy:
        Status: !Ref MailStorageBackupPolicy
